{% extends 'prendas/base.html' %}

{% block title %}{{ titulo }} - Boutique de Ropa{% endblock %}

{% block content %}

<div class="titulo">
    <h2>{{ titulo }}</h2>
    <p>Completa los datos de la prenda.</p>
</div>

<div class="formulario">

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="boton">
            Guardar prenda
        </button>

        <a href="{% url 'lista_prendas' %}" class="boton boton-editar">
            Cancelar
        </a>
    </form>

</div>

{% endblock %}
