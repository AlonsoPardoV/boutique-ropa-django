<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Boutique de Ropa{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f1f2;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .titulo {
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            padding: 10px 15px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .boton:hover {
            background-color: #444;
        }

        .boton-eliminar {
            background-color: #b52b2b;
        }

        .boton-editar {
            background-color: #555;
        }

        .tabla {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        .tabla th,
        .tabla td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .tabla th {
            background-color: #222;
            color: white;
        }

        .formulario {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 650px;
        }

        .formulario p {
            margin-bottom: 15px;
        }

        .formulario input,
        .formulario select,
        .formulario textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .errorlist {
            color: #b52b2b;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>🛍️ Boutique de Ropa</h1>

        <nav>
            <a href="{% url 'lista_prendas' %}">Catálogo</a>
            <a href="{% url 'crear_prenda' %}">Agregar prenda</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Boutique de Ropa - Sistema de gestión de prendas</p>
    </footer>

</body>
</html>
